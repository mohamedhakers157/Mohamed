<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>إضافة مريض | مختبر المهدى</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo"><i class="fas fa-flask"></i> مختبر المهدى</a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
        <li><a href="patients.html" class="active"><i class="fas fa-user-injured"></i> إضافة مريض</a></li>
        <li><a href="staff.html"><i class="fas fa-user-nurse"></i> إضافة موظف</a></li>
        <li><a href="tests.html"><i class="fas fa-vial"></i> التحاليل</a></li>
        <li><a href="results.html"><i class="fas fa-clipboard-list"></i> النتائج</a></li>
        <li><a href="contact.html"><i class="fas fa-envelope"></i> تواصل</a></li>
      </ul>
      <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <main class="main-content">
    <section class="form-section card">
      <div class="section-header"><i class="fas fa-user-plus"></i><h2>إضافة مريض جديد</h2></div>
      <form id="patientForm" class="modern-form" onsubmit="return false;">
        <div class="form-group"><label><i class="fas fa-user"></i> اسم المريض</label><input type="text" id="patientName" placeholder="أدخل الاسم الكامل" required><div class="error-msg" id="nameError"></div></div>
        <div class="form-row">
          <div class="form-group"><label><i class="fas fa-calendar-alt"></i> العمر</label><input type="number" id="patientAge" placeholder="العمر" min="0" max="120" required><div class="error-msg" id="ageError"></div></div>
          <div class="form-group"><label><i class="fas fa-venus-mars"></i> الجنس</label><select id="patientGender" required><option value="">اختر الجنس</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select><div class="error-msg" id="genderError"></div></div>
        </div>
        <div class="form-group"><label><i class="fas fa-phone"></i> رقم الهاتف</label><input type="tel" id="patientPhone" placeholder="أدخل رقم الهاتف" required><div class="error-msg" id="phoneError"></div></div>
        <div class="form-group"><label><i class="fas fa-map-marker-alt"></i> العنوان</label><input type="text" id="patientAddress" placeholder="العنوان بالتفصيل" required><div class="error-msg" id="addressError"></div></div>
        <button type="submit" class="btn btn-primary btn-block" onclick="addPatient()"><i class="fas fa-save"></i> حفظ البيانات</button>
      </form>
      <div id="patientSuccessMsg" class="success-msg" style="display:none;"></div>
    </section>

    <section class="list-section card">
      <div class="section-header"><i class="fas fa-list-ul"></i><h2>المرضى المسجلين</h2></div>
      <div class="table-responsive"><table class="modern-table"><thead><tr><th>الاسم</th><th>العمر</th><th>الجنس</th><th>الهاتف</th><th>العنوان</th><th>إجراء</th></tr></thead><tbody id="patientsTableBody"></tbody></table></div>
      <div id="noPatientsMsg" class="empty-msg" style="display:none;"><i class="fas fa-info-circle"></i> لا يوجد مرضى مسجلين حتى الآن.</div>
    </section>
  </main>

  <footer><p>&copy; 2026 مختبر المهدى للتحاليل الطبية. جميع الحقوق محفوظة.</p></footer>
  <script src="script.js"></script>
</body>
</html>
